name: Publish task PDFs to Drive

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task_id:
        description: Uždavinio ID vieno PDF bandymui
        required: true
        default: U000001
        type: string
      apply:
        description: Tikrai publikuoti (false vykdo dry-run)
        required: true
        default: false
        type: boolean
      confirmation:
        description: 'Tikram rankiniam bandymui įrašykite PUBLISH ir uždavinio ID'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: task-pdf-publication
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    # Be bendro leidimo galimi tik patvirtinti U000001 / U000003 / U000004 bandymai arba dry-run.
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' && (vars.DRIVE_PDF_PUBLICATION_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.apply == false || (inputs.task_id == 'U000001' && inputs.confirmation == 'PUBLISH U000001') || (inputs.task_id == 'U000003' && inputs.confirmation == 'PUBLISH U000003') || (inputs.task_id == 'U000004' && inputs.confirmation == 'PUBLISH U000004'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard first publication of this workflow
        id: first_publication
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && ! git cat-file -e "$GITHUB_SHA^:.github/workflows/publikuoti-uzdavinius.yml" 2>/dev/null; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Pirmasis workflow paskelbimas: Drive operacijos praleidžiamos.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Find changed task PDFs
        id: changed
        if: steps.first_publication.outputs.skip != 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 Uzduociu_bankas/Skriptai/publikuoti_pdf.py --list-changed --target-commit "$GITHUB_SHA" > "$RUNNER_TEMP/changed-pdfs.json"
          python3 -c 'import json,sys; tasks=json.load(open(sys.argv[1], encoding="utf-8"))["tasks"]; print("has_pdfs=" + ("true" if tasks else "false")); print("Pasikeitę PDF: " + str(len(tasks)), file=sys.stderr)' "$RUNNER_TEMP/changed-pdfs.json" >> "$GITHUB_OUTPUT"

      - name: Install rclone
        if: steps.first_publication.outputs.skip != 'true' && (github.event_name != 'push' || steps.changed.outputs.has_pdfs == 'true')
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Confirm main has not advanced
        if: steps.first_publication.outputs.skip != 'true' && (github.event_name != 'push' || steps.changed.outputs.has_pdfs == 'true')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Publish PDFs and verify Drive access
        if: steps.first_publication.outputs.skip != 'true' && (github.event_name != 'push' || steps.changed.outputs.has_pdfs == 'true')
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
          PILOT_TASK_ID: ${{ inputs.task_id }}
          PILOT_APPLY: ${{ inputs.apply }}
          DRIVE_PILOT_CONFIRMATION: ${{ inputs.confirmation }}
          DRIVE_PDF_PUBLICATION_ENABLED: ${{ vars.DRIVE_PDF_PUBLICATION_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$PILOT_APPLY" = "true" ]; then
              if [ "$DRIVE_PILOT_CONFIRMATION" != "PUBLISH $PILOT_TASK_ID" ]; then
                echo 'Klaida: trūksta tikslaus rankinio publikavimo patvirtinimo.' >&2
                exit 1
              fi
              if [ "$PILOT_TASK_ID" = 'U000003' ]; then
                python3 Uzduociu_bankas/Skriptai/publikuoti_pdf.py --publish --only U000003 --pilot-u000003
              elif [ "$PILOT_TASK_ID" = 'U000004' ]; then
                python3 Uzduociu_bankas/Skriptai/publikuoti_pdf.py --publish --only U000004 --pilot-u000004
              elif [ "$DRIVE_PDF_PUBLICATION_ENABLED" = "true" ]; then
                python3 Uzduociu_bankas/Skriptai/publikuoti_pdf.py --publish --only "$PILOT_TASK_ID"
              else
                test "$PILOT_TASK_ID" = 'U000001'
                python3 Uzduociu_bankas/Skriptai/publikuoti_pdf.py --publish --only U000001 --pilot-u000001
              fi
            else
              if [ "$PILOT_TASK_ID" = 'U000003' ]; then
                python3 Uzduociu_bankas/Skriptai/publikuoti_pdf.py --dry-run --only U000003 --first-u000003
              elif [ "$PILOT_TASK_ID" = 'U000004' ]; then
                python3 Uzduociu_bankas/Skriptai/publikuoti_pdf.py --dry-run --only U000004 --first-u000004
              else
                python3 Uzduociu_bankas/Skriptai/publikuoti_pdf.py --dry-run --only "$PILOT_TASK_ID"
              fi
            fi
          else
            test "$DRIVE_PDF_PUBLICATION_ENABLED" = "true"
            python3 Uzduociu_bankas/Skriptai/publikuoti_pdf.py --publish --target-commit "$GITHUB_SHA"
          fi

      - name: Persist verified registry to main
        if: steps.first_publication.outputs.skip != 'true' && ((github.event_name == 'push' && steps.changed.outputs.has_pdfs == 'true') || (github.event_name == 'workflow_dispatch' && inputs.apply == true))
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          if git diff --quiet -- Uzduociu_bankas/drive_links.json Uzduociu_bankas/drive_publication_state.json; then
            echo "Registro pakeitimų nėra."
            exit 0
          fi
          git add -- Uzduociu_bankas/drive_links.json Uzduociu_bankas/drive_publication_state.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update task PDF Drive registry'
          git push origin HEAD:main
