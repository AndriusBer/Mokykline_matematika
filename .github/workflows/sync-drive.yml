name: Sync to Google Drive

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Setup Service Account Credentials
        env:
          GDRIVE_JSON: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          python3 -c "import os; open('service_account.json', 'w').write(os.environ['GDRIVE_JSON'])"

      - name: Sync files to Google Drive
        run: |
          rclone sync . :drive: \
            --drive-service-account-file=service_account.json \
            --drive-root-folder-id="${{ secrets.GDRIVE_FOLDER_ID }}" \
            --drive-scope=drive \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --exclude "service_account.json"
