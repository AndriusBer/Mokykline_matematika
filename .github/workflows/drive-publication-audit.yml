name: Audit task PDF publication (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-pdf-publication
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone
      - name: Verify Git PDFs and Drive without changing them
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
        run: python3 Uzduociu_bankas/Skriptai/patikrinti_publikavimo_zyma.py --target-commit "$GITHUB_SHA"
